[package]
name = "klvm_rs"
version = "0.17.5"
authors = ["Richard Kiss <him@richardkiss.com>"]
edition = "2024"
license = "Apache-2.0"
description = "Implementation of `klvm` for Chik Network's cryptocurrency"
homepage = "https://github.com/Chik-Network/klvm_rs/"
repository = "https://github.com/Chik-Network/klvm_rs/"
readme = "../README.md"
publish = false

[lib]
name = "klvm_rs"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
klvmr = { workspace = true }
pyo3 = { workspace = true, features = ["abi3-py310", "extension-module"] }

[features]
openssl = ["klvmr/openssl"]
